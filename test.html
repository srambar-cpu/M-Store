
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON CLOCK</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080b14;
    color: white;
    font-family: Arial, sans-serif;
}

.clock {
    width: 90%;
    max-width: 430px;
    padding: 35px 20px;
    text-align: center;
    background: #111827;
    border: 1px solid #273b60;
    border-radius: 22px;
    box-shadow: 0 0 35px #1764ff22;
}

h1 {
    color: #55aaff;
    letter-spacing: 5px;
    font-size: 22px;
}

#time {
    margin: 35px 0 15px;
    font-size: clamp(42px, 12vw, 65px);
    font-weight: bold;
    color: #61c5ff;
    text-shadow: 0 0 15px #168bff;
    font-variant-numeric: tabular-nums;
}

#date {
    color: #a9b9d5;
    font-size: 16px;
}

button {
    margin-top: 30px;
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    background: #2878ed;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.status {
    margin-top: 25px;
    color: #5ce6a3;
    font-size: 12px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="clock">

    <h1>NEON CLOCK</h1>

    <div id="time">00:00:00</div>

    <div id="date">Cargando fecha...</div>

    <button onclick="toggleFormat()">
        Cambiar formato 12/24
    </button>

    <div class="status">
        ● SISTEMA ACTIVO
    </div>

</div>

<script>
let format24 = true;

function updateClock() {

    const now = new Date();

    const options = {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: !format24
    };

    document.getElementById("time").textContent =
        new Intl.DateTimeFormat("es-CO", options)
        .format(now);

    document.getElementById("date").textContent =
        new Intl.DateTimeFormat("es-CO", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(now);
}

function toggleFormat() {
    format24 = !format24;
    updateClock();
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
